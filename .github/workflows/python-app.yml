name: Python app deploy on GCP by GitHub Actions

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  id-token: write

jobs:
  main_job:
    runs-on: ubuntu-latest

    env:
      REGISTRY: europe-central2-docker.pkg.dev
      REPOSITORY: flask-app-repo
      IMAGE_NAME: flask-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          python3 -m unittest test.py
        env:
          CI: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Login to Google Artifact Registry
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}

      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        working-directory: terraform
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: >
          terraform plan -no-color -input=false -refresh=true
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}"
          -var="image_uri=${{ steps.build-image.outputs.image_uri }}"
        working-directory: terraform

      - name: Terraform Apply
        run: >
          terraform apply -input=false -auto-approve
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}"
          -var="image_uri=${{ steps.build-image.outputs.image_uri }}"
        working-directory: terraform
